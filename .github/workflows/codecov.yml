name: Test and Upload Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # 1. Install gotestsum (converts Go test output to JUnit XML)
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      # 2. Run tests, generate both coverage.txt AND junit.xml
      - name: Run Tests with Coverage and JUnit output
        run: |
          gotestsum --junitfile junit.xml -- -race -coverprofile=coverage.txt -covermode=atomic ./...

      # 3. Upload Coverage (populates the Coverage tab)
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: false
          verbose: true

      # 4. Upload Test Results (populates the Tests tab)
      - name: Upload Test Results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./junit.xml
